# AIDEV-NOTE: Catches bad meetups.json edits made where the local pre-commit hook can't run (e.g. GitHub's web editor).
# The full Jest run includes meetups-data.test.ts, which validates the data file.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn prettier --check .
      - run: yarn typecheck
      - run: yarn test
