# AIDEV-NOTE: Catches bad meetups.json edits made where the local pre-commit hook can't run (e.g. GitHub's web editor).
name: Validate meetup data

on:
  push:
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn validate-data
